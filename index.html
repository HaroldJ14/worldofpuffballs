
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>World of Puffballs</title>

    <style>
        body {
            background: linear-gradient(skyblue, turquoise);
            font-family: sans-serif;
            text-align: center;
            min-height: 100vh;
            margin: 0;
            padding: 24px;
            box-sizing: border-box;
        }

        h1 {
            color: darkblue;
        }

        #puffball {
            width: 220px;
            max-width: 80%;
            image-rendering: auto;
        }

        #dialogue {
            background: white;
            border: 3px solid darkblue;
            border-radius: 16px;
            padding: 16px;
            max-width: 400px;
            margin: 16px auto;
            overflow-wrap: anywhere;
        }

        #chat-box {
            max-width: 450px;
            margin: 20px auto;
            padding: 16px;
            background: rgba(255, 255, 255, 0.75);
            border: 2px solid darkblue;
            border-radius: 16px;
        }

        #user-message {
            width: 90%;
            box-sizing: border-box;
            padding: 12px;
            border: 2px solid darkblue;
            border-radius: 10px;
            font: inherit;
        }

        button {
            margin: 5px;
            padding: 10px 14px;
            border: 2px solid darkblue;
            border-radius: 10px;
            background: white;
            cursor: pointer;
            font: inherit;
        }

        button:hover {
            background: #d8f6ff;
        }

        button:disabled {
            cursor: wait;
            opacity: 0.6;
        }

        #status {
            min-height: 1.5em;
            overflow-wrap: anywhere;
        }

        #chat-history {
            max-height: 260px;
            overflow-y: auto;
            text-align: left;
            overflow-wrap: anywhere;
        }

        .chat-message {
            padding: 10px;
            margin: 8px 0;
            border-radius: 10px;
            background: white;
        }

        .user-chat {
            border-left: 4px solid #1685d1;
        }

        .puffball-chat {
            border-left: 4px solid darkblue;
        }
    </style>
</head>

<body>
    <h1>World of Puffballs!</h1>
    <p>Welcome to the puffball universe!</p>

    <!-- Blue Puffball starts with a neutral expression. -->
    <img
        id="puffball"
        src="images/blue-puffball-neutral.png"
        alt="Blue Puffball"
    >

    <!-- Blue Puffball's current dialogue. -->
    <p id="dialogue">Hi. Welcome to my world.</p>

    <!-- Chat with Blue Puffball's AI. -->
    <section id="chat-box">
        <h2>Talk to Blue Puffball!</h2>

        <div id="chat-history" aria-live="polite"></div>

        <form id="chat-form">
            <label for="user-message">Your message:</label>
            <br><br>

            <input
                id="user-message"
                name="message"
                type="text"
                placeholder="Say something to Blue Puffball..."
                maxlength="1000"
                autocomplete="off"
                required
            >

            <br>

            <button id="send-button" type="submit">
                Send message
            </button>
        </form>

        <p id="status" role="status"></p>
    </section>

    <h2>Expressions</h2>
    <p>You can also change Blue Puffball's expression manually!</p>

    <button type="button" onclick="changeExpression('neutral')">Neutral</button>
    <button type="button" onclick="changeExpression('happy')">Happy</button>
    <button type="button" onclick="changeExpression('sad')">Sad</button>
    <button type="button" onclick="changeExpression('angry')">Angry</button>
    <button type="button" onclick="changeExpression('confused')">Confused</button>
    <button type="button" onclick="changeExpression('surprised')">Surprised</button>
    <button type="button" onclick="changeExpression('laughing')">Laughing</button>
    <button type="button" onclick="changeExpression('sleepy')">Sleepy</button>
    <button type="button" onclick="changeExpression('embarrassed')">Embarrassed</button>
    <button type="button" onclick="changeExpression('rolling')">Rolling</button>

    <script>
        // Images for all ten expressions.
        const expressions = {
            neutral: "images/blue-puffball-neutral.png",
            happy: "images/blue-puffball-happy.png",
            sad: "images/blue-puffball-sad.png",
            angry: "images/blue-puffball-angry.png",
            confused: "images/blue-puffball-confused.png",
            surprised: "images/blue-puffball-surprised.png",
            laughing: "images/blue-puffball-laughing.png",
            sleepy: "images/blue-puffball-sleepy.png",
            embarrassed: "images/blue-puffball-embarrassed.png",
            rolling: "images/blue-puffball-rolling.png"
        };

        const puffballImage = document.getElementById("puffball");
        const dialogueText = document.getElementById("dialogue");
        const chatForm = document.getElementById("chat-form");
        const userMessage = document.getElementById("user-message");
        const sendButton = document.getElementById("send-button");
        const statusText = document.getElementById("status");
        const chatHistory = document.getElementById("chat-history");

        // Change Blue Puffball's expression.
        function changeExpression(emotion) {
            if (!expressions[emotion]) {
                return;
            }

            puffballImage.src = expressions[emotion];
            puffballImage.alt = "Blue Puffball looking " + emotion;
        }

        // Add a message to the chat without interpreting it as HTML.
        function addChatMessage(speaker, message, className) {
            const paragraph = document.createElement("p");
            paragraph.className = "chat-message " + className;

            const label = document.createElement("strong");
            label.textContent = speaker + ": ";

            paragraph.appendChild(label);
            paragraph.appendChild(document.createTextNode(message));
            chatHistory.appendChild(paragraph);

            chatHistory.scrollTop = chatHistory.scrollHeight;
        }

        // Send a message to the Cloudflare Worker.
        chatForm.addEventListener("submit", async function(event) {
            event.preventDefault();

            const message = userMessage.value.trim();

            if (!message) {
                return;
            }

            addChatMessage("You", message, "user-chat");

            userMessage.value = "";
            userMessage.disabled = true;
            sendButton.disabled = true;
            statusText.textContent = "Blue Puffball is thinking...";

            try {
                const response = await fetch("/api/chat", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        message: message
                    })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(
                        data.error || "The AI request failed."
                    );
                }

                if (typeof data.reply !== "string") {
                    throw new Error("Blue Puffball sent an unexpected reply.");
                }

                // Read the emotion tag at the beginning of the reply.
                const match = data.reply.match(
                    /^\s*\[(neutral|happy|sad|angry|confused|surprised|laughing|sleepy|embarrassed|rolling)\]\s*/i
                );

                let reply = data.reply;
                let emotion = "neutral";

                if (match) {
                    emotion = match[1].toLowerCase();
                    reply = reply.slice(match[0].length);
                }

                // Update Blue Puffball's picture and dialogue.
                changeExpression(emotion);
                dialogueText.textContent = reply;

                // Show the AI reply in the conversation.
                addChatMessage(
                    "Blue Puffball",
                    reply,
                    "puffball-chat"
                );

                statusText.textContent = "";
            } catch (error) {
                console.error("Blue Puffball chat error:", error);

                statusText.textContent =
                    "Uh-oh! I couldn't connect to my AI brain. " +
                    error.message;
            } finally {
                userMessage.disabled = false;
                sendButton.disabled = false;
                userMessage.focus();
            }
        });
    </script>
</body>
</html>
